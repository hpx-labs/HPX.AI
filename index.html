<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPX AI — HPX LABS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}

body{
    background:#050816;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#080d1d;
    border-right:1px solid #17233d;
    padding:22px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#38bdf8;
}

.brand{
    color:#64748b;
    font-size:11px;
    letter-spacing:2px;
    margin-top:5px;
    margin-bottom:28px;
}

.newchat{
    border:1px solid #168dcc;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:#fff;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    margin-bottom:20px;
}

.newchat:hover{
    transform:translateY(-1px);
    box-shadow:0 0 25px #0ea5e955;
}

.nav{
    padding:12px;
    color:#94a3b8;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:5px;
}

.nav:hover{
    background:#111a30;
    color:#fff;
}

.sidebottom{
    margin-top:auto;
    color:#475569;
    text-align:center;
    font-size:11px;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:68px;
    border-bottom:1px solid #17233d;
    display:flex;
    align-items:center;
    padding:0 25px;
    background:#070b18cc;
    backdrop-filter:blur(15px);
}

.top-title{
    font-weight:700;
}

.status{
    margin-left:auto;
    font-size:12px;
    color:#22c55e;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 7%;
}

.welcome{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logoicon{
    width:80px;
    height:80px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    box-shadow:0 0 45px #0ea5e955;
    margin-bottom:25px;
}

.welcome h1{
    font-size:46px;
    font-weight:800;
    background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#94a3b8;
    margin-top:12px;
    font-size:16px;
}

.message{
    max-width:850px;
    margin:18px auto;
    padding:17px 20px;
    border-radius:17px;
    line-height:1.65;
    white-space:pre-wrap;
    animation:appear .25s ease;
}

@keyframes appear{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

.user{
    background:#10243d;
    border:1px solid #1c527d;
}

.ai{
    background:#0b1224;
    border:1px solid #192743;
}

.label{
    color:#38bdf8;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:6px;
}

/* INPUT */
.input-area{
    padding:15px 7% 22px;
    border-top:1px solid #17233d;
}

.inputbox{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:center;
    padding:8px;
    border-radius:17px;
    background:#0b1224;
    border:1px solid #263653;
    box-shadow:0 10px 40px #0005;
}

textarea{
    flex:1;
    height:48px;
    resize:none;
    outline:none;
    border:0;
    background:transparent;
    color:white;
    padding:13px;
    font-size:15px;
}

textarea::placeholder{
    color:#64748b;
}

.send{
    width:48px;
    height:48px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:white;
    font-size:19px;
    cursor:pointer;
}

.send:hover{
    box-shadow:0 0 20px #0ea5e955;
}

.typing{
    max-width:850px;
    margin:10px auto;
    color:#64748b;
    font-size:13px;
}

/* MOBILE */
@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 16px;
    }

    .chat{
        padding:20px 12px;
    }

    .input-area{
        padding:10px;
    }

    .welcome h1{
        font-size:34px;
    }

    .logoicon{
        width:65px;
        height:65px;
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">⚡ HPX AI</div>
        <div class="brand">BY HPX LABS</div>

        <button class="newchat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="nav">💬 Chat</div>
        <div class="nav">🕘 History</div>
        <div class="nav">⚙️ Settings</div>
        <div class="nav">ℹ️ About HPX AI</div>

        <div class="sidebottom">
            HPX LABS © 2026
        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="top-title">
                HPX AI
            </div>

            <div class="status">
                ● READY
            </div>

        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="logoicon">
                    ⚡
                </div>

                <h1>Welcome to HPX AI</h1>

                <p>
                    Your intelligent AI assistant by HPX LABS.
                </p>

            </div>

        </section>


        <div class="input-area">

            <div class="inputbox">

                <textarea
                    id="input"
                    placeholder="Message HPX AI..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");


function handleKey(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();
        sendMessage();

    }

}


function addMessage(text,type){

    const welcome = document.getElementById("welcome");

    if(welcome){
        welcome.style.display="none";
    }

    const box=document.createElement("div");

    box.className="message "+type;

    const label=document.createElement("div");

    label.className="label";

    label.textContent =
        type==="user" ? "YOU" : "HPX AI";

    const content=document.createElement("div");

    content.textContent=text;

    box.appendChild(label);
    box.appendChild(content);

    chat.appendChild(box);

    chat.scrollTop=chat.scrollHeight;
}


function sendMessage(){

    const text=input.value.trim();

    if(!text) return;

    addMessage(text,"user");

    input.value="";


    const typing=document.createElement("div");

    typing.className="typing";

    typing.id="typing";

    typing.textContent="HPX AI is ready for API connection...";

    chat.appendChild(typing);

    chat.scrollTop=chat.scrollHeight;


    setTimeout(()=>{

        typing.remove();

        addMessage(
            "HPX AI interface is working successfully.\n\nConnect your AI API to enable real AI responses.",
            "ai"
        );

    },700);

}


function newChat(){

    chat.innerHTML=`

        <div class="welcome" id="welcome">

            <div class="logoicon">
                ⚡
            </div>

            <h1>Welcome to HPX AI</h1>

            <p>
                Your intelligent AI assistant by HPX LABS.
            </p>

        </div>

    `;

}

</script>

</body>
  </html>
